name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate application icon
        shell: powershell
        run: ./CardArchive/generate-icon.ps1
      - run: dotnet restore CardArchive/CardArchive.csproj
      - run: dotnet publish CardArchive/CardArchive.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None
      - uses: actions/upload-artifact@v4
        with:
          name: CardArchive-Windows-x64
          path: CardArchive/bin/Release/net10.0-windows/win-x64/publish/